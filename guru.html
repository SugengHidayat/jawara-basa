<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAWARA BASA — Rekap Guru</title><style>body{font:16px system-ui;background:#eaf2fc;color:#173653;margin:0}main{max-width:1000px;margin:28px auto;padding:24px;background:white;border-radius:18px}h1{color:#124b89}input,button{padding:12px;border-radius:9px;border:1px solid #b5c9df}button{background:#124b89;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border:1px solid #cbd9e8;text-align:left}th{background:#eaf2fc}.hint{color:#566e83}pre{white-space:pre-wrap;word-break:break-word}details{margin:12px 0;padding:10px;border:1px solid #d8e4f2;border-radius:9px}</style></head><body><main><p><a href="index.html">← Kembali ke modul</a></p><h1>👩‍🏫 Rekap Hasil Murid — JAWARA BASA</h1><p class="hint">Pilih satu atau beberapa berkas JSON hasil ekspor murid. Data diproses di browser guru, tidak dikirim ke server. Nilai otomatis hanya untuk pilihan ganda; uraian perlu penilaian guru.</p><input id="files" type="file" accept=".json,application/json" multiple><p id="status"></p><div id="out"></div><button onclick="downloadCSV()">⬇ Unduh Rekap CSV</button></main><script>let reports=[];document.getElementById('files').addEventListener('change',async e=>{reports=[];let errors=[];for(let f of e.target.files){try{let d=JSON.parse(await f.text());if(d.format==='jawara-lkpd-v4'&&Array.isArray(d.exercises)){d.chapters=d.exercises.map(e=>({title:'Halaman '+e.page,questions:e.questions,reflection:''}));}else if(d.format!=='jawara-basa-v2'||!Array.isArray(d.chapters))throw Error('Format bukan laporan JAWARA BASA');reports.push(d)}catch(err){errors.push(f.name+': '+err.message)}}document.getElementById('status').textContent=reports.length+' laporan terbaca. '+errors.join('; ');render()});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(d){let all=d.chapters.flatMap(c=>c.questions),pg=all.filter(q=>['choice','match','order'].includes(q.type));return {done:all.filter(q=>String(q.answer).trim()).length,total:all.length,correct:pg.filter(q=>q.correct===true).length,pg:pg.length}}function render(){let o=document.getElementById('out');o.innerHTML='<table><tr><th>Nama</th><th>Terisi</th><th>PG benar</th><th>Nilai PG</th><th>Detail</th></tr>'+reports.map((d,i)=>{let s=stats(d);return '<tr><td>'+esc(d.nama)+'</td><td>'+s.done+'/'+s.total+'</td><td>'+s.correct+'/'+s.pg+'</td><td>'+(s.pg?Math.round(100*s.correct/s.pg):'-')+'</td><td><button onclick="detail('+i+')">Lihat</button></td></tr>'}).join('')+'</table><div id="detail"></div>'}function detail(i){let d=reports[i];document.getElementById('detail').innerHTML='<h2>'+esc(d.nama)+'</h2>'+d.chapters.map(c=>'<details open><summary><b>Bab '+c.bab+': '+esc(c.title)+'</b></summary>'+c.questions.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q.question)+'</b><br>Jawaban: '+esc(q.answer||'(kosong)')+'<br><small>'+ (q.type==='choice'?(q.correct?'✓ Benar':'✗ Salah'):'Periksa manual oleh guru')+'</small></p>').join('')+'<p><b>Refleksi:</b> '+esc(c.reflection)+'</p></details>').join('')}function downloadCSV(){if(!reports.length){alert('Pilih berkas JSON dahulu.');return}let rows=[['Nama','Terisi','Total','PG Benar','PG Total','Nilai PG'],...reports.map(d=>{let s=stats(d);return [d.nama,s.done,s.total,s.correct,s.pg,s.pg?Math.round(100*s.correct/s.pg):'']})];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='rekap_jawara_basa.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}</script></body></html>
