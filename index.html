const key="jawara-basa-v1";let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
let page=0,feedback={};function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function go(n){page=Math.max(0,Math.min(5,n));feedback={};render();window.scrollTo({top:0,behavior:"smooth"})}
function speak(text){if(!("speechSynthesis" in window)){alert("Peramban iki ora ndhukung maca swara.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="id-ID";u.rate=.82;u.pitch=1;let voices=speechSynthesis.getVoices();let j=voices.find(v=>/^jv/i.test(v.lang));if(j){u.voice=j;u.lang=j.lang}speechSynthesis.speak(u)}
function qkey(ci,qi){return "c"+ci+"q"+qi}
function updateAnswer(ci,qi,val){saved[qkey(ci,qi)]=val;persist()}
function check(ci,qi){let q=chapters[ci].qs[qi],v=saved[qkey(ci,qi)];feedback[qi]=q.type==="choice"?(Number(v)===q.correct?"✓ Bener! ":"✗ Coba sinau maneh. ")+q.why:"Jawaban wis disimpen. Bandhingna karo tuladha, banjur rembugen karo guru.";render(false)}
function render(scroll=true){let app=document.getElementById("app");if(page===0){app.innerHTML=`<div class="hero"><span class="tag">MODUL HTML5 INTERAKTIF • KELAS IV • FASE B</span><h1>JAWARA BASA</h1><p>Jelajah Aksara, Wicara, lan Rasa Basa Jawa</p><p>📖 Pilih bab, wangsulana gladhen, lan rungokna materi.</p></div><div class="content"><h2>Daftar Isi — Klik bab kanggo miwiti</h2><p><a href="buku.html" style="display:inline-block;background:#f4b532;color:#382700;padding:12px 18px;border-radius:12px;font-weight:800;text-decoration:none">📚 Buka Buku Lengkap 88 Halaman + LKPD Digital</a></p><div class="toc">${chapters.map((c,i)=>`<button class="chapter" onclick="go(${i+1})"><img src="${c.image}" alt="Ilustrasi 3D ${escapeHtml(c.title)}"><span>Bab ${i+1} — ${escapeHtml(c.title)}<small>${escapeHtml(c.subtitle)}</small></span></button>`).join("")}</div><div class="section"><h3>Petunjuk</h3><p>Isi jawaban langsung ing buku iki. Pilihan ganda bisa dipriksa otomatis; isian lan uraian disimpen kanggo dirembug karo guru. Tombol 🔊 nggunakake suara sintesis piranti; pelafalan basa Jawa bisa durung sampurna.</p><p class="notice">Versi iki minangka prototipe interaktif adhedhasar topik modul PDF. Buku PDF 88 kaca bisa diwaca ing menu Buku & LKPD. Soal digital minangka pendamping, durung kabeh butir divalidasi ahli basa Jawa.</p></div></div>`;return}
let ci=page-1,c=chapters[ci],answered=c.qs.filter((q,i)=>saved[qkey(ci,i)]!==undefined&&String(saved[qkey(ci,i)]).trim()!=="").length;
app.innerHTML=`<div class="hero"><span class="tag">BAB ${page} / 5</span><h1>${escapeHtml(c.title)}</h1><p>${escapeHtml(c.subtitle)}</p></div><div class="content"><div class="chapterhead"><div><p><a class="btn gold" style="display:inline-block;text-decoration:none" href="buku.html?page=${[7,19,31,46,58][ci]}">📖 Bukak bab iki ing buku 88 kaca</a></p><h2>Ayo Sinau!</h2><p>${escapeHtml(c.intro)}</p><div class="controls"><button class="btn gold" onclick="speak(${JSON.stringify(c.intro)})">🔊 Rungokna</button><button class="btn secondary" onclick="speak(${JSON.stringify(c.title+". "+c.intro)})">🔊 Wacanen judhul</button></div></div><img src="${c.image}" alt="Ilustrasi animasi 3D bab ${page}"></div>${c.sections.map(s=>`<section class="section"><h3>${s.h}</h3>${s.html}<div class="controls"><button class="btn secondary" onclick="speak(this.parentElement.parentElement.innerText.replace('🔊 Rungokna materi',''))">🔊 Rungokna materi</button></div></section>`).join("")}<h2>✏️ Gladhen Interaktif</h2><div class="progress" aria-label="${answered} dari ${c.qs.length} terisi"><div style="width:${answered/c.qs.length*100}%"></div></div><p>${answered} saka ${c.qs.length} jawaban wis diisi.</p>${c.qs.map((q,i)=>{let k=qkey(ci,i),v=saved[k]??"";return `<section class="section"><h3>${i+1}. ${escapeHtml(q.q)}</h3>${q.type==="choice"?q.options.map((opt,j)=>`<label class="option"><input type="radio" name="${k}" value="${j}" ${String(v)===String(j)?"checked":""} onchange="updateAnswer(${ci},${i},this.value)">${escapeHtml(opt)}</label>`).join(""):`<textarea aria-label="Jawaban soal ${i+1}" placeholder="Tulisen wangsulanmu ing kene…" oninput="updateAnswer(${ci},${i},this.value)">${escapeHtml(v)}</textarea>`}<div class="controls"><button class="btn" onclick="check(${ci},${i})">${q.type==="choice"?"Priksa Wangsulan":"Deleng Tuladha"}</button><button class="btn secondary" onclick="speak(${JSON.stringify(q.q)})">🔊 Rungokna soal</button></div>${feedback[i]?`<div class="result">${escapeHtml(feedback[i])}${q.type==="text"?`<p><b>Tuladha:</b> ${escapeHtml(q.sample)}</p>`:""}</div>`:""}</section>`}).join("")}<div class="section"><h3>🌱 Refleksi</h3><p>Apa sing wis kok mangerteni? Apa sing isih perlu dilatih?</p><textarea aria-label="Refleksi" oninput="saved['reflection${ci}']=this.value;persist()" placeholder="Tulisen refleksimu…">${escapeHtml(saved["reflection"+ci]??"")}</textarea></div></div><div class="nav"><button onclick="go(${page-1})">← ${page===1?"Daftar Isi":"Bab Sadurungé"}</button><button onclick="go(0)">⌂ ISI</button><button onclick="go(${page===5?0:page+1})">${page===5?"Rampung ✓":"Bab Sabanjuré →"}</button></div>`;
}
function showProgress(){let count=0,total=0;chapters.forEach((c,ci)=>c.qs.forEach((q,qi)=>{total++;if(saved[qkey(ci,qi)]!==undefined&&String(saved[qkey(ci,qi)]).trim())count++}));alert("Kemajuan JAWARA BASA: "+count+" saka "+total+" soal wis diisi. Jawaban disimpen ing piranti iki. Kanggo ngirim menyang guru, klik Simpan Jawaban.")}
function exportJSON(){
 let nama=prompt("Tulisen jeneng murid kanggo laporan:",saved._nama||"");
 if(!nama||!nama.trim())return;
 saved._nama=nama.trim();persist();
 let report={format:"jawara-basa-v2",nama:saved._nama,exported_at:new Date().toISOString(),chapters:chapters.map((c,ci)=>({
 bab:ci+1,title:c.title,questions:c.qs.map((q,qi)=>{
 const v=saved[qkey(ci,qi)];
 return {question:q.q,type:q.type,answer:v===undefined?"":q.type==="choice"?(q.options[Number(v)]||""):v,
 correct:q.type==="choice"?Number(v)===q.correct:null,expected:q.type==="choice"?q.options[q.correct]:q.sample}
 }),reflection:saved["reflection"+ci]||""
 }))};
 let blob=new Blob([JSON.stringify(report,null,2)],{type:"application/json"});
